{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
{% assign build_time = site.time | date: '%Y%m%d%H%M%S' %}
{% assign asset_version = site.github.build_revision | default: build_time %}
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css?v={{ asset_version | slugify }}">
{% if page.page_class == 'homepage' %}
<link rel="preload" href="{{ '/assets/fonts/inter-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/crimson-text-latin-600.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
{% endif %}
