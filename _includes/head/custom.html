{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<script>
  document.documentElement.classList.add("js-enhanced");
  try {
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark' || ((!savedTheme || savedTheme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  } catch (_) { /* Use the default theme when storage is unavailable. */ }
</script>

<style>
  :root {
    --nav-link-text-color: #3f4b59;
    --nav-link-hover-color: #285781;
    --nav-link-active-color: #285781;
    --content-heading-color: #1f4e79;
    --content-subheading-color: #335c81;
    --global-text-color: #334155;
    --global-link-color: #285781;
    --global-link-color-hover: #1d4264;
  }

  html[data-theme="dark"] {
    --nav-link-text-color: #d5dde8;
    --nav-link-hover-color: #a3c9ef;
    --nav-link-active-color: #a3c9ef;
    --content-heading-color: #93c5fd;
    --content-subheading-color: #bfdbfe;
    --global-bg-color: #19212d;
    --global-text-color: #e2e8f0;
    --global-link-color: #a3c9ef;
    --global-link-color-hover: #c3ddf7;
    --global-border-color: #39475a;
    --global-code-background-color: #242d3b;
    --global-code-text-color: #e2e8f0;
  }

  html {
    scroll-behavior: auto;
  }

  .page__content h1,
  .page__content h2,
  .page__content h3,
  .page__content h4 {
    scroll-margin-top: calc(var(--masthead-offset, 70px) + 0.75rem);
  }

  .page__content h2 {
    color: var(--content-heading-color);
  }

  .page__content h3 {
    color: var(--content-subheading-color);
  }

  .author__map-widget {
    margin-top: 1rem;
    white-space: normal;
    cursor: default;
  }

  .author__map-widget .author__map-widget-inner {
    width: 220px;
    max-width: 100%;
    overflow: hidden;
    border-radius: 6px;
  }

  .author__map-widget a {
    margin: 0;
    padding: 0;
    display: inline-block;
  }

  .author__map-widget img {
    display: block;
    width: 100%;
    height: auto;
    border: 1px solid var(--global-border-color);
    border-radius: 6px;
    background: #fff;
  }

  .org-entry-title {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }

  .inline-org-logo {
    display: block;
    width: 1.725em;
    height: auto;
    flex: 0 0 1.725em;
    object-fit: contain;
  }

  .greedy-nav a {
    position: relative;
    transition: color 180ms ease, opacity 180ms ease;
  }

  .greedy-nav .visible-links > li:not(#theme-toggle) > a,
  .greedy-nav .hidden-links a {
    color: var(--nav-link-text-color);
  }

  .greedy-nav .visible-links > li:not(#theme-toggle) > a:hover,
  .greedy-nav .visible-links > li:not(#theme-toggle) > a:focus-visible,
  .greedy-nav .visible-links > li:not(#theme-toggle) > a.nav-section-active,
  .greedy-nav .hidden-links a:hover,
  .greedy-nav .hidden-links a:focus-visible {
    color: var(--nav-link-hover-color);
  }

  .masthead__menu-item.selected a,
  .masthead__menu-item.selected a:hover {
    color: var(--nav-link-active-color);
    border-bottom-color: var(--nav-link-active-color);
  }

  .masthead__menu-item--comment > a,
  .masthead__menu-item--comment > a:hover,
  .masthead__menu-item--comment > a:focus-visible,
  .masthead__menu-item--comment.selected > a,
  .masthead__menu-item--comment.selected > a:hover {
    color: var(--nav-link-active-color);
    font-weight: 700;
    border-bottom-color: var(--nav-link-active-color);
  }

  .greedy-nav .visible-links {
    position: relative;
    padding-right: 3rem;
  }

  .greedy-nav button:not(.hidden) + .visible-links {
    padding-right: 5.6rem;
  }

  .greedy-nav .visible-links #theme-toggle {
    position: absolute;
    top: 50%;
    right: 0;
    display: block;
    transform: translateY(-50%);
  }

  .greedy-nav button:not(.hidden) + .visible-links #theme-toggle {
    right: 2.8rem;
  }

  .greedy-nav .visible-links #theme-toggle a {
    margin: 0;
    width: 2rem;
    min-width: 2rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  @media (min-width: 64em) {
    .greedy-nav button.hidden + .visible-links {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      gap: 1.5rem;
    }

    .greedy-nav button.hidden + .visible-links > li:not(#theme-toggle) a {
      margin-left: 0;
      margin-right: 0;
    }
  }

  .greedy-nav a::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -0.2rem;
    width: 100%;
    height: 2px;
    background: currentColor;
    opacity: 0.7;
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 260ms ease;
  }

  .greedy-nav a:hover::after,
  .greedy-nav a:focus-visible::after,
  .greedy-nav a.nav-section-active::after {
    transform: scaleX(1);
  }

  .greedy-nav a.nav-section-active {
    font-weight: 600;
  }

  .greedy-nav .visible-links a::before {
    display: none;
  }

  #theme-toggle a::after { display: none; }

  .page__content .anchor-scroll-highlight {
    animation: anchorSectionPulse 260ms ease-out;
  }

  html.js-enhanced .page__content .reveal-on-scroll {
    opacity: 0;
    transform: translateY(10px);
    filter: none;
    transition:
      opacity 320ms ease-out,
      transform 380ms cubic-bezier(0.22, 1, 0.36, 1);
    transition-delay: var(--reveal-delay, 0ms);
  }

  html.js-enhanced .page__content .reveal-on-scroll.is-visible {
    opacity: 1;
    transform: translateY(0);
    filter: blur(0);
  }

  @keyframes anchorSectionPulse {
    0% {
      transform: translateY(3px);
      opacity: 0.75;
    }
    100% {
      transform: translateY(0);
      opacity: 1;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .greedy-nav a,
    .greedy-nav a::after {
      transition: none;
    }

    .page__content .anchor-scroll-highlight {
      animation: none;
    }

    html.js-enhanced .page__content .reveal-on-scroll,
    html.js-enhanced .page__content .reveal-on-scroll.is-visible {
      opacity: 1;
      transform: none;
      filter: none;
      transition: none;
    }
  }
</style>

{% unless page.page_class == 'homepage' %}
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const themeToggle = document.querySelector('#theme-toggle a');
    if (themeToggle) {
      themeToggle.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          themeToggle.click();
        }
      });
    }

    const navigationButton = document.querySelector('#site-nav > button');
    const navigationMenu = document.querySelector('#site-nav .hidden-links');
    const contactButton = document.querySelector('.author__urls-wrapper > button');
    const contactMenu = document.querySelector('.author__urls');
    const syncDisclosureState = () => {
      if (navigationButton && navigationMenu) {
        navigationButton.setAttribute('aria-expanded', String(!navigationMenu.classList.contains('hidden')));
      }
      if (contactButton && contactMenu) {
        contactButton.setAttribute('aria-expanded', String(getComputedStyle(contactMenu).display !== 'none'));
      }
    };
    const disclosureObserver = new MutationObserver(syncDisclosureState);
    if (navigationMenu) disclosureObserver.observe(navigationMenu, { attributes: true, attributeFilter: ['class'] });
    if (contactMenu) disclosureObserver.observe(contactMenu, { attributes: true, attributeFilter: ['class', 'style'] });
    syncDisclosureState();
    window.addEventListener('resize', () => {
      requestAnimationFrame(() => {
        if (document.body.classList.contains('homepage-body') && contactButton && contactMenu) {
          contactMenu.style.display = window.innerWidth >= 1024 || contactButton.classList.contains('open') ? 'block' : 'none';
        }
        syncDisclosureState();
      });
    });

    const closeNavigationMenu = () => {
      if (navigationMenu) navigationMenu.classList.add('hidden');
      if (navigationButton) navigationButton.classList.remove('close');
    };
    const closeContactMenu = () => {
      if (contactButton && contactMenu && getComputedStyle(contactButton).display !== 'none') {
        contactMenu.style.display = 'none';
        contactButton.classList.remove('open');
      }
    };
    document.addEventListener('click', (event) => {
      if (!event.target.closest('.greedy-nav')) closeNavigationMenu();
      if (!event.target.closest('.author__urls-wrapper')) closeContactMenu();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      if (navigationMenu && !navigationMenu.classList.contains('hidden')) {
        closeNavigationMenu();
        navigationButton.focus();
      }
      if (contactButton && contactButton.classList.contains('open')) {
        closeContactMenu();
        contactButton.focus();
      }
    });

    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const root = document.documentElement;
    const masthead = document.querySelector(".masthead");
    const navLinks = Array.from(document.querySelectorAll('.greedy-nav a[href*="#"]'));
    const navEntry = (performance.getEntriesByType && performance.getEntriesByType("navigation")[0]) || null;
    const isBackForward = navEntry && navEntry.type === "back_forward";

    if ("scrollRestoration" in history) {
      history.scrollRestoration = "manual";
    }

    if (!navLinks.length) return;

    let activeAnimation = null;
    let cancelActiveScroll = null;
    let activeHighlightTimer = null;
    let scrollTicking = false;

    const samePageHashTarget = (link) => {
      try {
        const url = new URL(link.href, window.location.href);
        if (url.origin !== window.location.origin) return null;
        if (url.pathname.replace(/\/+$/, "") !== window.location.pathname.replace(/\/+$/, "")) return null;
        if (!url.hash) return null;
        const id = decodeURIComponent(url.hash.slice(1));
        return id ? document.getElementById(id) : null;
      } catch (_) {
        return null;
      }
    };

    const linkTargets = navLinks
      .map((link) => ({ link, target: samePageHashTarget(link) }))
      .filter((item) => item.target);

    if (!linkTargets.length && !document.body.classList.contains('homepage-body')) return;

    const getOffset = () => {
      const mastheadHeight = masthead ? masthead.getBoundingClientRect().height : 70;
      return Math.round(mastheadHeight + 8);
    };

    const updateOffsetVar = () => {
      root.style.setProperty("--masthead-offset", getOffset() + "px");
    };

    const easeInOutCubic = (t) => (t < 0.5)
      ? 4 * t * t * t
      : 1 - Math.pow(-2 * t + 2, 3) / 2;

    const animateScrollTo = (targetY, duration) => {
      if (cancelActiveScroll) cancelActiveScroll();

      const startY = window.scrollY;
      const distance = targetY - startY;
      if (Math.abs(distance) < 2 || reducedMotion) {
        window.scrollTo(0, targetY);
        return Promise.resolve(true);
      }

      return new Promise((resolve) => {
        const startedAt = performance.now();
        cancelActiveScroll = () => {
          cancelAnimationFrame(activeAnimation);
          activeAnimation = null;
          cancelActiveScroll = null;
          resolve(false);
        };

        const step = (now) => {
          const elapsed = now - startedAt;
          const progress = Math.min(elapsed / duration, 1);
          const eased = easeInOutCubic(progress);
          window.scrollTo(0, Math.round(startY + distance * eased));

          if (progress < 1) {
            activeAnimation = requestAnimationFrame(step);
            return;
          }

          activeAnimation = null;
          cancelActiveScroll = null;
          resolve(true);
        };

        activeAnimation = requestAnimationFrame(step);
      });
    };

    for (const eventName of ['wheel', 'touchstart']) {
      window.addEventListener(eventName, () => {
        if (cancelActiveScroll) cancelActiveScroll();
      }, { passive: true });
    }
    window.addEventListener('keydown', (event) => {
      if (['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End'].includes(event.key) && cancelActiveScroll) cancelActiveScroll();
    });

    const focusSection = (section) => {
      section.classList.remove("anchor-scroll-highlight");
      // Force reflow so repeated clicks retrigger the animation.
      void section.offsetWidth;
      section.classList.add("anchor-scroll-highlight");
      clearTimeout(activeHighlightTimer);
      activeHighlightTimer = window.setTimeout(() => {
        section.classList.remove("anchor-scroll-highlight");
      }, 300);
    };

    const scrollToSection = async (section, updateHash) => {
      closeNavigationMenu();
      closeContactMenu();
      const targetY = Math.max(0, section.getBoundingClientRect().top + window.scrollY - getOffset());
      const distance = Math.abs(targetY - window.scrollY);
      const duration = Math.min(420, Math.max(180, distance * 0.25));

      const reachedTarget = await animateScrollTo(targetY, duration);
      if (!reachedTarget) return;
      focusSection(section);

      if (updateHash) {
        history.pushState(null, "", "#" + section.id);
      }
      updateActiveNav();
    };

    const updateActiveNav = () => {
      if (!linkTargets.length) return;
      const threshold = getOffset() + 28;
      let current = linkTargets[0];

      for (const item of linkTargets) {
        if (item.target.getBoundingClientRect().top <= threshold) {
          current = item;
        } else {
          break;
        }
      }

      if (window.scrollY > 0 && window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 2) {
        current = linkTargets[linkTargets.length - 1];
      }

      for (const item of linkTargets) {
        item.link.classList.toggle("nav-section-active", item === current);
        if (item === current) {
          item.link.setAttribute("aria-current", "true");
        } else {
          item.link.removeAttribute("aria-current");
        }
      }
    };

    const onScroll = () => {
      if (scrollTicking) return;
      scrollTicking = true;
      requestAnimationFrame(() => {
        updateActiveNav();
        scrollTicking = false;
      });
    };

    for (const { link, target } of linkTargets) {
      link.addEventListener("click", (event) => {
        if (
          event.defaultPrevented ||
          event.button !== 0 ||
          event.metaKey ||
          event.ctrlKey ||
          event.shiftKey ||
          event.altKey
        ) {
          return;
        }

        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();
        scrollToSection(target, true);
      });
    }

    updateOffsetVar();
    updateActiveNav();

    window.addEventListener("resize", () => {
      updateOffsetVar();
      updateActiveNav();
    });
    window.addEventListener("scroll", onScroll, { passive: true });

    if (!window.location.hash && !isBackForward) {
      window.requestAnimationFrame(() => {
        window.scrollTo(0, 0);
        updateActiveNav();
      });
    }

    if (window.location.hash) {
      const initialId = decodeURIComponent(window.location.hash.slice(1));
      const initialTarget = initialId ? document.getElementById(initialId) : null;
      if (initialTarget) {
        window.requestAnimationFrame(() => {
          window.scrollTo(0, Math.max(0, initialTarget.getBoundingClientRect().top + window.scrollY - getOffset()));
          updateActiveNav();
        });
      }
    }

    const contentRoot = document.querySelector(".page__content");
    if (!contentRoot || reducedMotion || !("IntersectionObserver" in window)) return;

    const revealCandidates = Array.from(contentRoot.querySelectorAll(':scope > h2, :scope > p, .document-link, .publication-card, .homepage-list > li, .comment-intro, .comment-panel')).filter((el) => {
      if (!(el instanceof HTMLElement)) return false;
      if (!el.offsetParent && el !== document.activeElement) return false;
      const tag = el.tagName;
      return !["SCRIPT", "STYLE"].includes(tag);
    });

    let sectionOrder = -1;
    let itemOrder = 0;

    for (const el of revealCandidates) {
      const tag = el.tagName;
      const startsSection = /^H[1-3]$/.test(tag);

      if (startsSection) {
        sectionOrder += 1;
        itemOrder = 0;
      }

      if (sectionOrder < 0) {
        sectionOrder = 0;
      }

      const delayMs = Math.min(100, itemOrder * 30);
      el.classList.add("reveal-on-scroll");
      el.style.setProperty("--reveal-delay", delayMs + "ms");
      el.dataset.revealSection = String(sectionOrder);
      itemOrder += 1;
    }

    const revealObserver = new IntersectionObserver((entries, observer) => {
      for (const entry of entries) {
        if (!entry.isIntersecting) continue;
        entry.target.classList.add("is-visible");
        observer.unobserve(entry.target);
      }
    }, {
      root: null,
      rootMargin: "0px 0px -24px 0px",
      threshold: 0.05,
    });

    const viewportBottom = window.scrollY + window.innerHeight;
    const initiallyVisible = [];
    for (const el of revealCandidates) {
      const top = el.getBoundingClientRect().top + window.scrollY;
      if (top < viewportBottom - 48) {
        initiallyVisible.push(el);
      } else {
        revealObserver.observe(el);
      }
    }
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        initiallyVisible.forEach(el => el.classList.add('is-visible'));
      });
    });
  });
</script>
